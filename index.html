<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWS Academy Quiz</title>
<meta name="description" content="Practice AWS Academy knowledge checks for Cloud Foundations and the Developer course.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=202611201444">
</head>
<body>
<svg id="web" aria-hidden="true" viewBox="0 0 400 400"></svg>

<main class="wrap">
  <h1 class="title">AWS Academy Quiz</h1>
  <p class="sub" id="sub"></p>

  <section id="setup">
    <div class="bar" id="mods" role="group" aria-label="Modules"></div>
    <div class="opts">
      <label><input type="checkbox" id="shuf" checked> Shuffle questions</label>
      <label><input type="checkbox" id="shufo"> Shuffle answers</label>
    </div>
    <button class="btn primary" id="go">Start quiz</button>
    <p class="info" id="info"></p>
  </section>

  <section id="play" class="hide">
    <div class="meta"><span id="pos"></span><span id="combo"></span><span id="sc"></span></div>
    <div class="thread"><i id="pb"></i><b id="spider" aria-hidden="true">🕷️</b></div>
    <div class="card" id="card">
      <p class="q" id="qt"></p>
      <p class="hint" id="qh"></p>
      <div id="ol"></div>
      <div class="fb hide" id="fb" role="status"></div>
      <div class="act">
        <button class="btn" id="quit">Quit</button>
        <button class="btn primary" id="main">Check</button>
      </div>
    </div>
  </section>

  <section id="end" class="hide">
    <div class="card" data-tag="Mission report">
      <p class="rank" id="rank"></p>
      <p class="score" id="es"></p>
      <p class="hint" id="et"></p>
      <ul class="wl" id="wl"></ul>
      <div class="act">
        <button class="btn" id="home">Menu</button>
        <button class="btn primary" id="again">Retry mistakes</button>
      </div>
    </div>
  </section>
</main>

<div id="pop" aria-hidden="true"></div>

<script src="js/questions.js?v=202611201444"></script>
<script src="js/app.js?v=202611201444"></script>
</body>
</html>
